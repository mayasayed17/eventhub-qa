name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  EVENTHUB_USERS_DEFAULT_EMAIL: ${{ secrets.EVENTHUB_USERS_DEFAULT_EMAIL }}
  EVENTHUB_USERS_DEFAULT_PASSWORD: ${{ secrets.EVENTHUB_USERS_DEFAULT_PASSWORD }}
  EVENTHUB_USERS_SECONDARY_EMAIL: ${{ secrets.EVENTHUB_USERS_SECONDARY_EMAIL }}
  EVENTHUB_USERS_SECONDARY_PASSWORD: ${{ secrets.EVENTHUB_USERS_SECONDARY_PASSWORD }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Framework self-tests (offline)
        run: mvn -B test -Dgroups=framework
      - name: Run API tests
        run: mvn -B test -Dgroups=api
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: target/surefire-reports/

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Playwright browser
        run: mvn -B -q compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Run UI tests
        run: mvn -B test -Dgroups=ui
      - name: Upload reports, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-reports
          path: |
            target/surefire-reports/
            target/ui-artifacts/
