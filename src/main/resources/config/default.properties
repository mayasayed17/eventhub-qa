# Defaults shared by every environment. Override per environment in config/<env>.properties,
# locally in ./local.properties, or with -Dkey=value / EVENTHUB_<KEY> environment variables.

ui.baseUrl=https://eventhub.rahulshettyacademy.com
api.baseUrl=https://api.eventhub.rahulshettyacademy.com
api.basePath=/api

# Log every request/response (Authorization header is always masked)
api.logging=false
api.connectTimeoutMs=15000
api.readTimeoutMs=30000

# ---- Authentication ----
auth.loginPath=/auth/login
# Where the token sits in the login response. First match wins.
auth.tokenJsonPaths=data.token,token,data.accessToken,accessToken
# Used only when the token is not a JWT with an exp claim
auth.fallbackTokenTtlMinutes=30

# ---- UI ----
# chromium | firefox | webkit | chrome | msedge
ui.browser=chromium
ui.headless=true
ui.slowMoMs=0
ui.defaultTimeoutMs=15000
ui.viewportWidth=1366
ui.viewportHeight=900
# token-injection (fast: puts the API token in localStorage) | login-form (drives the login page)
ui.auth.strategy=token-injection
ui.auth.tokenStorageKey=eventhub_token
# off | retain-on-failure | always
ui.trace=retain-on-failure
ui.artifactsDir=target/ui-artifacts

# ---- Test data ----
data.namePrefix=QA Auto
data.emailDomain=example.com
